name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Export macOS SDK path
        run: |
          echo "SDK_PATH=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux-release:
    needs: goreleaser
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build Linux Release Binary
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          ASSET="mnemosyne_${VERSION}_linux_${{ matrix.arch }}.tar.gz"

          go build -tags sqlite_fts5 \
            -ldflags "-w -X github.com/gandazgul/mnemosyne/cmd.Version=${VERSION} -X github.com/gandazgul/mnemosyne/cmd.Commit=${COMMIT} -X github.com/gandazgul/mnemosyne/cmd.Date=${DATE} -X github.com/gandazgul/mnemosyne/cmd.Release=true" \
            -o mnemosyne .

          actual="$(./mnemosyne version)"
          expected="mnemosyne ${VERSION} (linux/${{ matrix.arch }})"
          if [ "${actual}" != "${expected}" ]; then
            echo "Expected version output: ${expected}" >&2
            echo "Actual version output:   ${actual}" >&2
            exit 1
          fi

          tar -czf "${ASSET}" mnemosyne LICENSE README.md CHANGELOG.md
        env:
          CGO_ENABLED: "1"

      - name: Upload Linux Release Asset
        run: gh release upload "${GITHUB_REF_NAME}" "mnemosyne_${GITHUB_REF_NAME#v}_linux_${{ matrix.arch }}.tar.gz" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-release:
    needs: goreleaser
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Set up MSYS2/MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-sqlite3 zip

      - name: Verify Windows CGO Dependencies
        shell: msys2 {0}
        run: |
          command -v gcc
          test -f /mingw64/include/sqlite3.h
          test -f /mingw64/lib/libsqlite3.dll.a

      - name: Build Windows Release Binary
        shell: msys2 {0}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          ASSET="mnemosyne_${GITHUB_REF_NAME}_windows_amd64.zip"

          go build -tags sqlite_fts5 \
            -ldflags "-w -X github.com/gandazgul/mnemosyne/cmd.Version=${VERSION} -X github.com/gandazgul/mnemosyne/cmd.Commit=${COMMIT} -X github.com/gandazgul/mnemosyne/cmd.Date=${DATE}" \
            -o mnemosyne.exe .

          ./mnemosyne.exe version
          zip "${ASSET}" mnemosyne.exe
        env:
          CGO_ENABLED: "1"
          CC: gcc
          CGO_CFLAGS: "-I/mingw64/include"
          CGO_LDFLAGS: "-L/mingw64/lib"

      - name: Upload Windows Release Asset
        shell: pwsh
        run: gh release upload "${env:GITHUB_REF_NAME}" "mnemosyne_${env:GITHUB_REF_NAME}_windows_amd64.zip" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
