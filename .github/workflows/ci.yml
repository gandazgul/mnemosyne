name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  linux-arm64-compile:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Compile Test Packages
        run: go test -run '^$' -tags sqlite_fts5 ./...
        env:
          CGO_ENABLED: "1"

      - name: Build Dev Binary
        run: |
          go build -tags sqlite_fts5 -o mnemoteca-linux-arm64 .
          first_line="$(./mnemoteca-linux-arm64 version | sed -n '1p')"
          expected="mnemoteca dev (linux/arm64)"
          if [ "$first_line" != "$expected" ]; then
            echo "Expected version output: $expected" >&2
            echo "Actual version output:   $first_line" >&2
            exit 1
          fi
        env:
          CGO_ENABLED: "1"

  test-and-build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
            artifact: mnemoteca-linux-amd64
          - os: macos-latest
            target: darwin-arm64
            artifact: mnemoteca-darwin-arm64
          - os: windows-latest
            target: windows-amd64
            artifact: mnemoteca-windows-amd64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up MSYS2/MinGW
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-sqlite3

      - name: Set up Python
        if: runner.os != 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Hugging Face CLI (hf)
        if: runner.os != 'Windows'
        run: |
          pip install -U "huggingface_hub" "hf_transfer"

      - name: Install Task
        if: runner.os != 'Windows'
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Native Libraries
        if: runner.os != 'Windows'
        run: |
          go mod tidy
          task download-onnxruntime

      - name: Run Linter
        if: matrix.os == 'ubuntu-latest'
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --build-tags sqlite_fts5 --timeout=5m
        env:
          CGO_LDFLAGS: "-L${{ github.workspace }}/lib"

      - name: Cache Models
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: models
          key: ${{ runner.os }}-models-${{ hashFiles('Taskfile.yml') }}
          restore-keys: |
            ${{ runner.os }}-models-

      - name: Download Models
        if: runner.os != 'Windows'
        run: task download-models
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Test
        if: runner.os != 'Windows'
        run: task test

      - name: Installer Tests
        if: runner.os != 'Windows'
        run: task test:install

      - name: Release Artifact Contract Tests
        if: runner.os != 'Windows'
        run: task test:release-artifacts

      - name: Verify Windows CGO Dependencies
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          command -v gcc
          test -f /mingw64/include/sqlite3.h
          test -f /mingw64/lib/libsqlite3.dll.a

      - name: Compile Windows Tests
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: go test -run '^$' -tags sqlite_fts5 ./...
        env:
          CGO_ENABLED: "1"
          CC: gcc
          CGO_CFLAGS: "-I/mingw64/include"
          CGO_LDFLAGS: "-L/mingw64/lib"

      - name: Build Dev Binary
        if: runner.os != 'Windows'
        run: |
          task build VERSION=dev
          mv mnemoteca ${{ matrix.artifact }}
          first_line="$(./${{ matrix.artifact }} version | sed -n '1p')"
          expected="mnemoteca dev ($(go env GOOS)/$(go env GOARCH))"
          if [ "$first_line" != "$expected" ]; then
            echo "Expected version output: $expected" >&2
            echo "Actual version output:   $first_line" >&2
            exit 1
          fi

      - name: Build Windows Binary
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          go build -tags sqlite_fts5 -o ${{ matrix.artifact }} .
          first_line="$(./${{ matrix.artifact }} version | sed -n '1p')"
          expected="mnemoteca dev (windows/amd64)"
          if [ "$first_line" != "$expected" ]; then
            echo "Expected version output: $expected" >&2
            echo "Actual version output:   $first_line" >&2
            exit 1
          fi
        env:
          CGO_ENABLED: "1"
          CC: gcc
          CGO_CFLAGS: "-I/mingw64/include"
          CGO_LDFLAGS: "-L/mingw64/lib"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mnemoteca-${{ matrix.target }}
          path: ${{ matrix.artifact }}
          retention-days: 7
