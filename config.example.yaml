# Mnemoteca configuration
#
# Default location:
#   ~/.config/mnemoteca/config.yaml
#
# Use another config file for experiments:
#   MNEMOTECA_CONFIG=/path/to/config.yaml mnemoteca search "query"
#
# MNEMOTECA_DB_PATH overrides db_path, which is useful for benchmarks.

# Path to the SQLite database
db_path: "~/.local/share/mnemoteca/mnemoteca.db"

embedding:
  # Path to the embedding model directory
  model_path: "~/.local/share/mnemoteca/models/snowflake-arctic-embed-m-v1.5"
  onnx_file: "onnx/model.onnx"
  dimensions: 256
  max_seq_length: 512
  query_prefix: "Represent this sentence for searching relevant passages: "
  document_prefix: ""
  # Pooling values:
  # - none: model emits a pooled sentence_embedding output
  # - mean: mean-pool token embeddings using attention_mask
  # - cls: use the first token embedding
  # - last: use the last non-padding token embedding
  pooling: "none"
  onnx_input_names: ["input_ids", "attention_mask"]
  onnx_output_names: ["sentence_embedding"]

reranker:
  # Path to the reranker model directory
  model_path: "~/.local/share/mnemoteca/models/ms-marco-MiniLM-L-6-v2"
  max_seq_length: 512
  enabled: true

search:
  # Default fusion retrieves vector candidates first, then applies a small
  # in-memory BM25 lexical boost over that candidate set. Use "rrf" for the
  # legacy global FTS + vector Reciprocal Rank Fusion mode.
  fusion: "vector-bm25"
  bm25_weight: 0.10
  rrf_k: 60
  top_k: 10
  rerank_candidates: 50
  # Minimum reranker sigmoid score for inclusion.
  reranker_threshold: 0.001
  # Minimum fused score for inclusion (when reranking is disabled).
  rrf_threshold: 0.01
