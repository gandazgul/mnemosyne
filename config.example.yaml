# Mnemosyne configuration
#
# Default location:
#   ~/.config/mnemosyne/config.yaml
#
# Use another config file for experiments:
#   MNEMOSYNE_CONFIG=/path/to/config.yaml mnemosyne search "query"
#
# MNEMOSYNE_DB_PATH overrides db_path, which is useful for benchmarks.

# Path to the SQLite database
db_path: "~/.local/share/mnemosyne/mnemosyne.db"

embedding:
  # Path to the embedding model directory
  model_path: "~/.local/share/mnemosyne/models/snowflake-arctic-embed-m-v1.5"
  onnx_file: "onnx/model.onnx"
  dimensions: 256
  max_seq_length: 512
  query_prefix: "Represent this sentence for searching relevant passages: "
  document_prefix: ""
  # Pooling values:
  # - none: model emits a pooled sentence_embedding output
  # - mean: mean-pool token embeddings using attention_mask
  # - cls: use the first token embedding
  # - last: use the last non-padding token embedding
  pooling: "none"
  onnx_input_names: ["input_ids", "attention_mask"]
  onnx_output_names: ["sentence_embedding"]

reranker:
  # Path to the reranker model directory
  model_path: "~/.local/share/mnemosyne/models/ms-marco-MiniLM-L-6-v2"
  max_seq_length: 512
  enabled: true

search:
  rrf_k: 60
  top_k: 10
  rerank_candidates: 50
  # Minimum reranker sigmoid score for inclusion.
  reranker_threshold: 0.001
  # Minimum RRF score for inclusion (when reranking is disabled).
  rrf_threshold: 0.01
